# jbsnewmedia/vibe4dock-arcvd - usage example
#
# All configuration happens via environment variables (see .env.example).
# The Veronica user database lives in ./data (volume, not publicly served).

services:
  vibe4dock:
    image: jbsnewmedia/vibe4dock-arcvd:1.0
    # build: .            # alternatively build locally
    container_name: arcvd
    ports:
      # HOST_HTTP_PORT and HTTP_PORT come from the .env file
      - "${HOST_HTTP_PORT:-80}:${HTTP_PORT:-80}"
      # HTTPS: uncomment this mapping when HTTPS_PORT is set (e.g. 443)
      # - "${HOST_HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    environment:
      # --- Routing ---
      VIBE_PREFIX: ${VIBE_PREFIX:-vibe}
      # PWA app name + start page title (default: Vibe4Dock)
      VIBE_NAME: ${VIBE_NAME:-Vibe4Dock}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-}
      # Branding line shown in the shell status bar (optional)
      # SHELL_HINT: "Vibe4Dock AACV by JBS New Media | https://github.com/jbsnewmedia/vibe4dock-arcvd"
      # SSL_CERT_PATH: /data/certs/cert.pem     # own certificates (optional)
      # SSL_KEY_PATH: /data/certs/key.pem

      # --- Basic Auth (only active when username AND password are set) ---
      SITE_USERNAME: ${SITE_USERNAME:-}
      SITE_PASSWORD: ${SITE_PASSWORD:-}
      CHAT_USERNAME: ${CHAT_USERNAME:-}
      CHAT_PASSWORD: ${CHAT_PASSWORD:-}
      VERONICA_USERNAME: ${VERONICA_USERNAME:-}
      VERONICA_PASSWORD: ${VERONICA_PASSWORD:-}
      ROOT_SHELL_USERNAME: ${ROOT_SHELL_USERNAME:-}
      ROOT_SHELL_PASSWORD: ${ROOT_SHELL_PASSWORD:-}
      APP_SHELL_USERNAME: ${APP_SHELL_USERNAME:-}
      APP_SHELL_PASSWORD: ${APP_SHELL_PASSWORD:-}

      # --- opencode (shared, optional per-service overrides) ---
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_PROVIDER: ${OPENCODE_PROVIDER:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      OPENCODE_AGENT: ${OPENCODE_AGENT:-}
      # CHAT_OPENCODE_MODEL: ...
      # VERONICA_OPENCODE_MODEL: ...

      # --- Vibe-Diff (git working tree UI) ---
      # Repo path inside the container; default: parent of the webroot (/app).
      # Mount your project repo (rw for reverts) and point this to it:
      # VIBE_DIFF_REPO: /app/project
      DIFF_USERNAME: ${DIFF_USERNAME:-}
      DIFF_PASSWORD: ${DIFF_PASSWORD:-}

      # --- Veronica ---
      VERONICA_ALLOW_REGISTRATION: ${VERONICA_ALLOW_REGISTRATION:-1}
      # User DB seed (only on FIRST start, afterwards the JSON file applies):
      VERONICA_BOOTSTRAP_ADMIN: ${VERONICA_BOOTSTRAP_ADMIN:-}
      VERONICA_BOOTSTRAP_ADMIN_PIN_HASH: ${VERONICA_BOOTSTRAP_ADMIN_PIN_HASH:-}
      VERONICA_BOOTSTRAP_USERS: ${VERONICA_BOOTSTRAP_USERS:-}
      VERONICA_USERS_FILE: /data/veronica-users.json
    volumes:
      # Veronica user JSON DB (outside all web roots)
      - ./data:/data
      # git repo for Vibe-Diff (rw: line/block revert writes to the worktree)
      # - ./project:/app/project
      # opencode persistence: settings/auth, sessions, state (models.json)
      - ./opencode/config:/home/application/.config/opencode
      - ./opencode/share:/home/application/.local/share/opencode
      - ./opencode/state:/home/application/.local/state/opencode
    restart: unless-stopped
