name: docker

on:
  push:
    branches: [v2] # v2 ist der Default-Branch
    tags: ["v*", "*.*.*"] # v2.0.0 and bare 1.0.0
  workflow_dispatch:
  schedule:
    # taeglich 04:23 UTC (05:23/06:23 MEZ/MESZ), off-hour wegen GitHub-Throttling
    - cron: "23 4 * * *"

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # production variant: webdevops/php-apache (prod base)
          - suffix: ""
            base-image: webdevops/php-apache:8.5
            variant: prod
          # dev variant: webdevops/php-apache-dev (xdebug, composer, dev tools)
          - suffix: "-dev"
            base-image: webdevops/php-apache-dev:8.5
            variant: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta (${{ matrix.suffix }})
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: jbsnewmedia/vibe4dock-arcvd${{ matrix.suffix }}
          tags: |
            # latest: every push to the default branch and every v* tag
            type=raw,value=latest${{ matrix.suffix }},enable=${{ startsWith(github.ref, 'refs/heads/') || startsWith(github.ref, 'refs/tags/v') }}
            # v2.0.0 -> 2.0.0 (+ 2.0); v2.0.1 -> 2.0.1 (+ moves 2.0); -dev variant appends -dev
            type=semver,pattern={{version}},suffix=${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.suffix }}

      - name: Build and push (${{ matrix.suffix }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=${{ matrix.base-image }}
            VARIANT=${{ matrix.variant }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
