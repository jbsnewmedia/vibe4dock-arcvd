name: docker

on:
  push:
    branches: [main]
    tags: ["v*", "*.*.*"] # v1.0.0 and bare 1.0.0
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # production variant: webdevops/php-apache (prod base)
          - suffix: ""
            base-image: webdevops/php-apache:8.5
            variant: prod
          # dev variant: webdevops/php-apache-dev (xdebug, composer, dev tools)
          - suffix: "-dev"
            base-image: webdevops/php-apache-dev:8.5
            variant: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta (${{ matrix.suffix }})
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: jbsnewmedia/vibe4dock-arcvd${{ matrix.suffix }}
          tags: |
            # latest: every main push and every v* tag
            type=raw,value=latest${{ matrix.suffix }},enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            # v1.0.0 -> 1.0.0 (+ 1.0); v1.0.1 -> 1.0.1 (+ moves 1.0); -dev variant appends -dev
            type=semver,pattern={{version}},suffix=${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.suffix }}

      - name: Build and push (${{ matrix.suffix }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=${{ matrix.base-image }}
            VARIANT=${{ matrix.variant }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
